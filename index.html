<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EastBay NeuroTech — People, with Brains.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header .divider {
            width: 60px;
            height: 1px;
            background: rgba(255, 255, 255, 0.4);
        }

        .header .slogan {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
        }

        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .footer .philosophy {
            font-size: 12px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <canvas id="network"></canvas>
    <div class="overlay">
        <div class="header">
            <h1>EastBay NeuroTech</h1>
            <div class="divider"></div>
            <div class="slogan">People-first NeuroTech</div>
        </div>
        <div class="footer">
            <div class="philosophy">People-centric development of NeuroTech, with an emphasis on opensource and community-driven technologies.</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('network');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let nodes = [];
        let mouse = { x: null, y: null, down: false, dragNode: null };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', () => {
            resize();
            nodes = [];
            initNodes();
        });

        // Brain outline (left hemisphere) - points approximating a brain profile
        function getBrainPoints(count, scale, offsetX, offsetY) {
            const points = [];
            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;

                // Brain-like shape using superposition of harmonics
                const r = scale * (
                    1.0
                    + 0.15 * Math.cos(2 * t)
                    - 0.1 * Math.cos(3 * t)
                    + 0.08 * Math.cos(4 * t)
                    - 0.05 * Math.cos(5 * t)
                    + 0.12 * Math.sin(2 * t)
                );

                // Flatten the bottom slightly
                const yStretch = t > Math.PI ? 0.85 : 1.0;

                const x = offsetX + r * Math.cos(t);
                const y = offsetY + r * Math.sin(t) * yStretch * 1.15;
                points.push({ x, y });
            }
            return points;
        }

        // East Bay silhouette (right hemisphere) - stylized coastline
        function getEastBayPoints(count, scale, offsetX, offsetY) {
            const points = [];
            // Approximate the East Bay shoreline shape
            const coastline = [
                { x: 0.0, y: -1.0 },   // Richmond top
                { x: 0.15, y: -0.85 },
                { x: 0.25, y: -0.7 },   // El Cerrito
                { x: 0.2, y: -0.55 },
                { x: 0.3, y: -0.4 },    // Berkeley
                { x: 0.35, y: -0.25 },
                { x: 0.3, y: -0.1 },    // Emeryville
                { x: 0.25, y: 0.0 },    // Oakland inner harbor
                { x: 0.35, y: 0.1 },
                { x: 0.4, y: 0.25 },    // Alameda
                { x: 0.35, y: 0.4 },
                { x: 0.3, y: 0.55 },    // San Leandro
                { x: 0.2, y: 0.7 },
                { x: 0.15, y: 0.85 },   // Hayward
                { x: 0.0, y: 1.0 },     // Fremont
                // Inland return (hills)
                { x: -0.2, y: 0.9 },
                { x: -0.35, y: 0.7 },
                { x: -0.4, y: 0.5 },
                { x: -0.38, y: 0.3 },
                { x: -0.35, y: 0.1 },
                { x: -0.4, y: -0.1 },   // Hills
                { x: -0.38, y: -0.3 },
                { x: -0.35, y: -0.5 },
                { x: -0.3, y: -0.7 },
                { x: -0.2, y: -0.9 },
            ];

            const totalSegments = coastline.length;
            for (let i = 0; i < count; i++) {
                const progress = (i / count) * totalSegments;
                const segIndex = Math.floor(progress) % totalSegments;
                const segFrac = progress - Math.floor(progress);
                const nextIndex = (segIndex + 1) % totalSegments;

                const x = offsetX + scale * (coastline[segIndex].x + (coastline[nextIndex].x - coastline[segIndex].x) * segFrac);
                const y = offsetY + scale * (coastline[segIndex].y + (coastline[nextIndex].y - coastline[segIndex].y) * segFrac);
                points.push({ x, y });
            }
            return points;
        }

        // Fill interior with scattered points
        function fillInterior(outlinePoints, count, offsetX, offsetY, scale) {
            const filled = [];
            // Find bounding box
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (const p of outlinePoints) {
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y);
                maxY = Math.max(maxY, p.y);
            }

            let attempts = 0;
            while (filled.length < count && attempts < count * 20) {
                attempts++;
                const x = minX + Math.random() * (maxX - minX);
                const y = minY + Math.random() * (maxY - minY);

                if (isInsidePolygon(x, y, outlinePoints)) {
                    filled.push({ x, y });
                }
            }
            return filled;
        }

        function isInsidePolygon(x, y, polygon) {
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i].x, yi = polygon[i].y;
                const xj = polygon[j].x, yj = polygon[j].y;
                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
            }
            return inside;
        }

        function initNodes() {
            const scale = Math.min(width, height) * 0.28;
            const gap = scale * 0.15; // gap between hemispheres

            // Left hemisphere: brain
            const brainOffsetX = centerX - gap;
            const brainOffsetY = centerY;
            const brainOutline = getBrainPoints(60, scale, brainOffsetX, brainOffsetY);
            const brainInterior = fillInterior(brainOutline, 80, brainOffsetX, brainOffsetY, scale);

            // Right hemisphere: East Bay
            const ebOffsetX = centerX + gap;
            const ebOffsetY = centerY;
            const ebOutline = getEastBayPoints(60, scale, ebOffsetX, ebOffsetY);
            const ebInterior = fillInterior(ebOutline, 80, ebOffsetX, ebOffsetY, scale);

            // Combine outline + interior for each side
            const brainAll = [...brainOutline, ...brainInterior];
            const ebAll = [...ebOutline, ...ebInterior];

            // Create nodes for brain hemisphere
            for (const p of brainAll) {
                nodes.push({
                    x: p.x,
                    y: p.y,
                    baseX: p.x,
                    baseY: p.y,
                    vx: 0,
                    vy: 0,
                    radius: 1.5 + Math.random() * 1.5,
                    brightness: 0.3 + Math.random() * 0.3,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.002 + Math.random() * 0.003,
                    drift: 8 + Math.random() * 12,
                    side: 'brain'
                });
            }

            // Create nodes for East Bay hemisphere
            for (const p of ebAll) {
                nodes.push({
                    x: p.x,
                    y: p.y,
                    baseX: p.x,
                    baseY: p.y,
                    vx: 0,
                    vy: 0,
                    radius: 1.5 + Math.random() * 1.5,
                    brightness: 0.3 + Math.random() * 0.3,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.002 + Math.random() * 0.003,
                    drift: 8 + Math.random() * 12,
                    side: 'eastbay'
                });
            }

            // Corpus callosum nodes - bridge between hemispheres
            const ccCount = 25;
            for (let i = 0; i < ccCount; i++) {
                const t = (i / ccCount) - 0.5;
                const x = centerX + t * gap * 0.5;
                const y = centerY + (Math.random() - 0.5) * scale * 0.4;
                nodes.push({
                    x,
                    y,
                    baseX: x,
                    baseY: y,
                    vx: 0,
                    vy: 0,
                    radius: 1 + Math.random() * 1,
                    brightness: 0.2 + Math.random() * 0.2,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.003 + Math.random() * 0.004,
                    drift: 5 + Math.random() * 8,
                    side: 'cc'
                });
            }
        }

        // Wave state
        let waveTime = 0;
        const wavePeriod = 4000; // ms per cycle
        const waveDelay = 2000;

        function getConnectionDistance(nodeA, nodeB) {
            // Left hemisphere (brain): no connections
            if (nodeA.side === 'brain' && nodeB.side === 'brain') return 0;
            // Right hemisphere (East Bay): fully connected
            if (nodeA.side === 'eastbay' && nodeB.side === 'eastbay') return 120;
            // CC connects to both sides
            if (nodeA.side === 'cc' || nodeB.side === 'cc') return 80;
            // Cross-hemisphere
            return 30;
        }

        function animate(timestamp) {
            ctx.clearRect(0, 0, width, height);

            waveTime = timestamp % (wavePeriod + waveDelay);
            const waveProgress = waveTime < wavePeriod ? waveTime / wavePeriod : -1;

            // Update node positions with gentle drift
            for (const node of nodes) {
                if (mouse.dragNode === node) continue;

                const t = timestamp * node.speed;
                node.x = node.baseX + Math.sin(t + node.phase) * node.drift;
                node.y = node.baseY + Math.cos(t * 0.7 + node.phase * 1.3) * node.drift * 0.6;
            }

            // Draw connections
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const a = nodes[i];
                    const b = nodes[j];
                    const dx = a.x - b.x;
                    const dy = a.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = getConnectionDistance(a, b);

                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.15;

                        // Corpus callosum connections get a subtle blue tint
                        if ((a.side === 'cc' || b.side === 'cc') && a.side !== b.side) {
                            ctx.strokeStyle = `rgba(80, 160, 255, ${alpha * 1.5})`;
                        } else {
                            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                        }

                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.stroke();
                    }
                }
            }

            // Draw nodes
            for (const node of nodes) {
                let brightness = node.brightness;

                // Wave effect - travels left to right
                if (waveProgress >= 0) {
                    const waveX = (waveProgress * width * 1.4) - width * 0.2;
                    const distToWave = Math.abs(node.x - waveX);
                    if (distToWave < 80) {
                        const waveIntensity = 1 - distToWave / 80;
                        brightness = Math.min(1, brightness + waveIntensity * 0.7);
                    }
                }

                // Mouse proximity glow
                if (mouse.x !== null) {
                    const dx = node.x - mouse.x;
                    const dy = node.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        brightness = Math.min(1, brightness + (1 - dist / 150) * 0.4);
                    }
                }

                // Color: brain nodes white, cc nodes subtle blue
                let r = 255, g = 255, b = 255;
                if (node.side === 'cc') {
                    r = 120; g = 180; b = 255;
                }

                ctx.beginPath();
                ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${brightness})`;
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        // Mouse interaction
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            if (mouse.dragNode) {
                mouse.dragNode.x = e.clientX;
                mouse.dragNode.y = e.clientY;
                mouse.dragNode.baseX = e.clientX;
                mouse.dragNode.baseY = e.clientY;
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            mouse.down = true;
            // Find closest node
            let closest = null, minDist = 20;
            for (const node of nodes) {
                const dx = node.x - e.clientX;
                const dy = node.y - e.clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) {
                    minDist = dist;
                    closest = node;
                }
            }
            mouse.dragNode = closest;
        });

        canvas.addEventListener('mouseup', () => {
            mouse.down = false;
            mouse.dragNode = null;
        });

        canvas.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
            mouse.down = false;
            mouse.dragNode = null;
        });

        // Init
        resize();
        initNodes();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
